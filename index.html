<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mengarahkan ke Portal...</title>
    
    <!-- Redirect instan menggunakan meta refresh -->
    <meta http-equiv="refresh" content="0; url=http://portal.arthasa.my.id/">
    
    <!-- Redirect alternatif menggunakan JavaScript -->
    <script type="text/javascript">
        window.location.href = "http://portal.arthasa.my.id/";
    </script>
    
    <style>
        /* Gaya tampilan saat proses redirect */
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: #f0f2f5;
        }
        .loader {
            text-align: center;
            padding: 20px;
        }
        .spinner {
            border: 4px solid rgba(0,0,0,0.1);
            border-radius: 50%;
            border-top: 4px solid #3498db;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        p {
            color: #555;
            font-size: 16px;
        }
        a {
            color: #3498db;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="loader">
        <div class="spinner"></div>
        <p>Mengarahkan Anda ke <strong>Portal Arthasa</strong>...</p>
        <p>Jika tidak otomatis, klik <a href="http://portal.arthasa.my.id/">di sini</a>.</p>
    </div>
</body>
</html>
